name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npx hardhat compile
      - name: Generated art library is up to date
        run: npm run art:sol && git diff --exit-code contracts/art/FheCatArt.sol
      - run: npm test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: contracts
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: The admin's arena game is built from the current code
        run: npm run build:admin-game && git diff --exit-code ../landing/admin/mint/arena-game.js
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: End-to-end (local chain + CoFHE mocks)
        run: npm run test:e2e
        working-directory: web
        env:
          CI: 'true'

  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Site scripts and Vercel functions parse
        run: for f in api/*.js middleware.js js/*.js; do node --check "$f"; done
