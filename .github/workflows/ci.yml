name: CI

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npx hardhat compile
      - name: Generated art library is up to date
        run: npm run art:sol && git diff --exit-code contracts/art/FheCatArt.sol
      - run: npm test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: contracts
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: The admin's arena game is built from the current code
        run: npm run build:admin-game && git diff --exit-code ../landing/admin/mint/arena-game.js
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: End-to-end (local chain + CoFHE mocks)
        run: npm run test:e2e
        working-directory: web
        env:
          CI: 'true'
