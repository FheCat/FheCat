<!doctype html>
<!--
  Launch post image for X: "Curiosity killed the cat. So we encrypted ours."
  Drawn with the site's own pixel sprites, palette and fonts (../landing), at
  400 x 225 art pixels and exported 4x as a 1600 x 900 PNG. The top-left pixel
  is 99.6% opaque so X keeps the PNG instead of re-encoding it as a blurry JPEG.
  Open this file in a browser and press "Download PNG".
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FheCat launch post image</title>
    <style>
      @font-face {
        font-family: 'Tiny5';
        src: url('../landing/fonts/tiny5-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Silkscreen';
        src: url('../landing/fonts/silkscreen-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Press Start 2P';
        src: url('../landing/fonts/press-start-2p-latin.woff2') format('woff2');
      }
      body {
        margin: 0;
        padding: 24px;
        background: #021a2e;
        color: #b9cfe4;
        font: 16px/24px 'Silkscreen', monospace;
      }
      canvas {
        display: block;
        width: 800px;
        max-width: 100%;
        image-rendering: pixelated;
      }
      a {
        color: #0df3ff;
      }
    </style>
  </head>
  <body>
    <canvas id="out" width="1600" height="900"></canvas>
    <p><a id="dl" download="fhecat-launch-post.png" href="#">Download PNG</a></p>

    <script src="../landing/js/pixel.js"></script>
    <script src="../landing/js/sprites.js"></script>
    <script>
      (function () {
        'use strict';

        var NS = window.FheCat;
        var P = NS.pixel;
        var PAL = P.PALETTE;
        var W = 400;
        var H = 225;
        var SCALE = 4;
        var COL = {
          night: '#032842',
          deep: '#021f36',
          ink: '#021a2e',
          cloud: '#0d3b55',
          cloudNear: '#113a53',
          cloudHi: '#1d4e6c',
          cloudTop: '#26536e',
          moon: '#275775',
          star: '#1b698b',
          starHi: '#2c6989',
          steel: '#5e7b9d',
          steel2: '#3e6d88',
          steel3: '#2a4c66',
          cyan: '#0df3ff',
          cyanDim: '#1c88a7',
          white: '#e6f2ff',
          muted: '#7d9cba',
          red: '#ff5d73'
        };
        var FONT = { text: '8px Tiny5', label: '8px Silkscreen', mono: '8px "Press Start 2P"' };
        var CIPHER_BLOCK = Number(new URLSearchParams(location.search).get('block')) || 4; // px per cipher block

        function rng(seed) {
          var a = seed >>> 0;
          return function () {
            a = (a + 0x6d2b79f5) >>> 0;
            var t = a;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        function rect(ctx, x, y, w, h, color) {
          ctx.fillStyle = color;
          ctx.fillRect(x, y, w, h);
        }
        /** Sprite rows at (x, y), each pixel s x s; `map` can swap colours. */
        function sprite(ctx, rows, x, y, s, map) {
          s = s || 1;
          rows.forEach(function (row, j) {
            for (var i = 0; i < row.length; i++) {
              var ch = row[i];
              if (ch === '.' || ch === ' ') continue;
              var c = (map && map[ch]) || PAL[ch];
              if (c) rect(ctx, x + i * s, y + j * s, s, s, c);
            }
          });
        }
        function sparkle(ctx, x, y, color) {
          rect(ctx, x, y - 2, 1, 5, color);
          rect(ctx, x - 2, y, 5, 1, color);
        }
        /** Notched box: `t`-pixel border, corners cut. */
        function panel(ctx, x, y, w, h, fill, border, t) {
          rect(ctx, x + t, y, w - 2 * t, h, border);
          rect(ctx, x, y + t, w, h - 2 * t, border);
          rect(ctx, x + t, y + t, w - 2 * t, h - 2 * t, fill);
        }
        function ring(ctx, cx, cy, rad, color) {
          var x = rad;
          var y = 0;
          var err = 1 - rad;
          while (x >= y) {
            [[x, y], [y, x], [-y, x], [-x, y], [-x, -y], [-y, -x], [y, -x], [x, -y]].forEach(function (p) {
              rect(ctx, cx + p[0], cy + p[1], 1, 1, color);
            });
            y++;
            if (err < 0) err += 2 * y + 1;
            else {
              x--;
              err += 2 * (y - x) + 1;
            }
          }
        }

        // Text: drawn at the font's native 8px, snapped to hard pixels, then
        // scaled by a whole number, so every glyph stays exact.
        var scratch = document.createElement('canvas');
        scratch.width = 512;
        scratch.height = 32;
        var sctx = scratch.getContext('2d', { willReadFrequently: true });
        function measure(str, font) {
          sctx.font = font;
          return Math.ceil(sctx.measureText(str).width);
        }
        /** Draws `str` with its baseline at y; returns the width drawn. */
        function text(ctx, str, x, y, font, color, n, align) {
          n = n || 1;
          var w = measure(str, font);
          sctx.clearRect(0, 0, scratch.width, scratch.height);
          sctx.font = font;
          sctx.textBaseline = 'alphabetic';
          sctx.textAlign = 'left';
          sctx.fillStyle = '#fff';
          sctx.fillText(str, 0, 16);
          var img = sctx.getImageData(0, 0, w + 2, 24);
          var d = img.data;
          var rgb = [1, 3, 5].map(function (i) {
            return parseInt(color.slice(i, i + 2), 16);
          });
          for (var i = 0; i < d.length; i += 4) {
            if (d[i + 3] >= 110) {
              d[i] = rgb[0];
              d[i + 1] = rgb[1];
              d[i + 2] = rgb[2];
              d[i + 3] = 255;
            } else d[i + 3] = 0;
          }
          var strip = document.createElement('canvas');
          strip.width = w + 2;
          strip.height = 24;
          strip.getContext('2d').putImageData(img, 0, 0);
          var left = align === 'right' ? x - w * n : align === 'center' ? x - Math.round((w * n) / 2) : x;
          ctx.imageSmoothingEnabled = false;
          ctx.drawImage(strip, 0, 0, w + 2, 24, left, y - 16 * n, (w + 2) * n, 24 * n);
          return w * n;
        }

        /** Hill silhouette through control points, stepped to `step` pixels. */
        function hills(ctx, pts, color, step, ridge) {
          for (var x = 0; x < W; x += step) {
            var k = 0;
            while (k < pts.length - 2 && pts[k + 1][0] <= x) k++;
            var a = pts[k];
            var b = pts[k + 1];
            var t = Math.min(1, Math.max(0, (x - a[0]) / (b[0] - a[0])));
            var y = a[1] + (b[1] - a[1]) * (0.5 - Math.cos(t * Math.PI) / 2);
            y = Math.round(y / step) * step;
            rect(ctx, x, y, step, H - y, color);
            if (ridge) rect(ctx, x, y, step, 1, ridge);
          }
        }

        function draw(ctx) {
          var r = rng(0xfeca7);

          // --- the banner's night sky -----------------------------------------
          rect(ctx, 0, 0, W, H, COL.night);
          for (var i = 0; i < 120; i++) {
            rect(ctx, (r() * W) | 0, (r() * 190) | 0, 1, 1, r() < 0.3 ? COL.starHi : COL.star);
          }
          ring(ctx, 252, 26, 9, COL.moon);
          rect(ctx, 249, 24, 2, 2, COL.cloud);
          rect(ctx, 255, 29, 1, 1, COL.cloud);
          [[206, 14, COL.cyan], [388, 118, COL.cyanDim], [300, 62, COL.cyanDim], [14, 150, COL.cyanDim], [236, 118, COL.cyan]].forEach(function (s) {
            sparkle(ctx, s[0], s[1], s[2]);
          });

          // --- hills, as in the banner: low on the left, a mound on the right --
          hills(ctx, [[0, 200], [60, 196], [120, 201], [180, 194], [230, 197], [270, 184], [320, 172], [370, 168], [400, 174]], COL.cloud, 2, COL.cloudHi);
          hills(ctx, [[0, 210], [70, 205], [140, 211], [200, 206], [250, 208], [285, 199], [325, 194], [365, 195], [400, 199]], COL.cloudNear, 2, COL.cloudTop);
          hills(ctx, [[0, 218], [90, 214], [180, 219], [260, 215], [330, 213], [400, 216]], COL.deep, 2);

          // --- a locked crate on the mound, and our cat on it -----------------
          var S = 4;
          var cx = 300;
          var crateTop = 198 - 16 * S; // the crate's feet on the near hill
          NS.sprites.crate.layers.forEach(function (l) {
            sprite(ctx, l.rows, cx, crateTop, S);
          });

          // The banner cat, encrypted: steel outline, body in cipher blocks,
          // like the noise cat on the site and on the waitlist cards.
          var catRows = NS.sprites.cat.layers[0].rows; // cat-a
          var catX = cx - S;
          var catY = crateTop + 5 * S - 19 * S; // sitting on the lid
          var nr = rng(0xc1a7);
          var CIPHER = [COL.ink, COL.ink, COL.ink, COL.ink, COL.deep, COL.deep, COL.deep, COL.steel3, COL.steel3, COL.steel3, COL.cyanDim, COL.cyanDim, COL.star, COL.cyan];
          var DIM = 10; // around the eyes only the darker half, so the eyes stay the brightest thing
          var B = CIPHER_BLOCK;
          catRows.forEach(function (row, j) {
            for (var i = 0; i < row.length; i++) {
              var ch = row[i];
              if (ch === 's') rect(ctx, catX + i * S, catY + j * S, S, S, COL.steel);
              else if (ch === 'k') {
                for (var q = 0; q < (S / B) * (S / B); q++) {
                  var qx = (q % (S / B)) * B;
                  var qy = ((q / (S / B)) | 0) * B;
                  var nearEyes = j >= 3 && j <= 5 && i >= 3 && i <= 8;
                  rect(ctx, catX + i * S + qx, catY + j * S + qy, B, B, CIPHER[(nr() * (nearEyes ? DIM : CIPHER.length)) | 0]);
                }
              }
            }
          });
          // its eyes stay lit: cyan on a dark ring, above the noise
          NS.sprites.cat.layers[2].rows.forEach(function (row, j) {
            for (var i = 0; i < row.length; i++) {
              if (row[i] !== 'C') continue;
              rect(ctx, catX + i * S - 1, catY + j * S - 1, S + 2, S + 2, COL.ink);
              rect(ctx, catX + i * S, catY + j * S, S, S, COL.cyan);
            }
          });

          // --- curiosity: a big eye peeks in from the corner ---------------------
          var ex = 348;
          var ey = 8;
          sprite(ctx, NS.sprites.eye.layers[0].rows, ex, ey, 3);
          // ...its scan comes down and stops at the tag
          var tag = 'ACCESS DENIED';
          var tw = measure(tag, FONT.label) + 12;
          var tx = catX + 38 - (tw >> 1);
          var ty = catY - 22;
          for (var y = ey + 28; y < ty - 1; y++) if ((y - ey) % 4 < 2) rect(ctx, ex + 24, y, 1, 1, COL.red);
          panel(ctx, tx, ty, tw, 15, COL.ink, COL.red, 1);
          text(ctx, tag, tx + 6, ty + 11, FONT.label, COL.red);

          // --- brand, top left -------------------------------------------------
          NS.sprites.logo.layers.forEach(function (l) {
            if (l.cls !== 'glow') sprite(ctx, l.rows, 20, 14);
          });
          sprite(ctx, NS.art.wordmarkCells().cells, 52, 20);

          // --- the line ----------------------------------------------------------
          var LX = 20;
          text(ctx, 'Curiosity killed the cat.', LX, 72, FONT.text, COL.muted, 2);
          text(ctx, 'So we', LX, 104, FONT.text, COL.white, 3);
          var ew = text(ctx, 'encrypted', LX, 132, FONT.text, COL.cyan, 3);
          text(ctx, ' ours.', LX + ew, 132, FONT.text, COL.white, 3);

          // --- what, where, when -------------------------------------------------
          var lw = text(ctx, 'PIXEL CATS ON FHENIX', LX, 156, FONT.label, COL.muted);
          text(ctx, '·  MAINNET  ·  OCTOBER', LX + lw + 6, 156, FONT.label, COL.cyan);

          // the site's button: notched, cyan, hard shadow
          var label = 'FHECAT.COM/WAITLIST';
          var bw = measure(label, FONT.label) + 30;
          var bx = LX + 2;
          var by = 166;
          panel(ctx, bx, by + 3, bw, 17, COL.cyanDim, COL.cyanDim, 2);
          panel(ctx, bx, by, bw, 17, COL.cyan, COL.cyan, 2);
          text(ctx, label, bx + 9, by + 12, FONT.label, COL.ink);
          sprite(ctx, NS.sprites['i-arrow'], bx + bw - 14, by + 6, 1, { X: COL.ink });
        }

        function render() {
          var art = document.createElement('canvas');
          art.width = W;
          art.height = H;
          draw(art.getContext('2d'));
          var out = document.getElementById('out');
          var ctx = out.getContext('2d');
          ctx.imageSmoothingEnabled = false;
          ctx.drawImage(art, 0, 0, W * SCALE, H * SCALE);
          // one pixel at 99.6% opacity: X then keeps the PNG as a PNG
          var px = ctx.getImageData(0, 0, 1, 1);
          px.data[3] = 254;
          ctx.putImageData(px, 0, 0);
          var url = out.toDataURL('image/png');
          document.getElementById('dl').href = url;
          return url;
        }

        window.renderLaunch = function () {
          return Promise.all([document.fonts.load(FONT.text), document.fonts.load(FONT.label), document.fonts.load(FONT.mono)]).then(render);
        };
        window.renderLaunch();
      })();
    </script>
  </body>
</html>
